# Docker Compose - Muhasebe geliştirme
# Kullanım: cd infra && ./manage.sh start

networks:
  muhasebe_net:
    name: muhasebe_net
    driver: bridge

volumes:
  muhasebe_postgres_data:
  muhasebe_redis_data:
  muhasebe_minio_data:
  muhasebe_panel_node_modules:
  muhasebe_panel_next_cache:
  muhasebe_backend_uploads:
  muhasebe_caddy_data:
  muhasebe_caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    container_name: muhasebe_postgres
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: muhasebe_db
      TZ: Europe/Istanbul
    volumes:
      - muhasebe_postgres_data:/var/lib/postgresql/data
    networks:
      muhasebe_net:
        aliases: [ muhasebe_postgres ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: muhasebe_redis
    restart: unless-stopped
    ports:
      - "6372:6379"
    command: redis-server --appendonly yes
    volumes:
      - muhasebe_redis_data:/data
    networks:
      muhasebe_net:
        aliases: [ muhasebe_redis ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: muhasebe_minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_REGION: us-east-1
    volumes:
      - muhasebe_minio_data:/data
    ports:
      - "9202:9000"
      - "9203:9001"
    networks:
      muhasebe_net:
        aliases: [ muhasebe_minio ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ../../api-stage
      dockerfile: server/Dockerfile.staging.prod
    container_name: muhasebe_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@muhasebe_postgres:5432/muhasebe_db
      REDIS_URL: redis://muhasebe_redis:6379
      MINIO_ENDPOINT: muhasebe_minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: muhasebe
      MINIO_USE_SSL: "false"
      JWT_SECRET: supersecretkey123456789abcdefghijklmnopqrstuvwxyz
      JWT_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: https://muhasebe.localhost,http://muhasebe.localhost,https://api.muhasebe.localhost,http://api.muhasebe.localhost,http://localhost:3140,http://localhost:3120
      STORAGE_DRIVER: minio
    networks:
      - muhasebe_net
    ports:
      - "3120:3000"
    volumes:
      - muhasebe_backend_uploads:/app/server/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  user-panel:
    image: node:20-alpine
    container_name: muhasebe_panel
    working_dir: /app
    ports:
      - "3140:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3120
      NEXT_PUBLIC_DEVELOPER_MODE: "true"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      API_PROXY_TARGET: "http://muhasebe_backend:3000"
    volumes:
      - ../../panel-stage/client:/app
      - muhasebe_panel_node_modules:/app/node_modules
      - muhasebe_panel_next_cache:/app/.next
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    networks:
      - muhasebe_net
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: muhasebe_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - muhasebe_caddy_data:/data
      - muhasebe_caddy_config:/config
    networks:
      - muhasebe_net
    depends_on:
      backend: { condition: service_healthy }
      user-panel: { condition: service_healthy }