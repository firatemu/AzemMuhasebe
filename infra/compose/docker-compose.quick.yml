networks:
  app_net:
    name: azemmuhasebe_net
    external: true

services:
  backend-staging:
    image: node:20-alpine
    container_name: azemmuhasebe_backend-staging
    working_dir: /app
    ports:
      - "3031:3000"
    env_file:
      - .env.staging
    environment:
      NODE_ENV: development
    volumes:
      - ../../api-stage/server:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npm run dev"
    networks: [ app_net ]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  user-panel-staging:
    image: node:20-alpine
    container_name: azemmuhasebe_panel
    working_dir: /app
    ports:
      - "3021:3000"
    env_file:
      - .env.staging
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_DEVELOPER_MODE: "true"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      API_PROXY_TARGET: "http://azemmuhasebe_backend-staging:3000"
    volumes:
      - ../../panel-stage/client:/app
      - panel_stage_node_modules:/app/node_modules
      - panel_stage_next_cache:/app/.next
    command: sh -c "npm install && npm run dev"
    networks: [ app_net ]
    depends_on:
      - backend-staging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  panel_stage_node_modules:
  panel_stage_next_cache:
